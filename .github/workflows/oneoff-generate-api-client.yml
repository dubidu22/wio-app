# ONE-OFF (plan 004, D-91): generates the Dart API client on GitHub's runner,
# because the cloud session that wrote the #4 PR may not run the generator.
# Colin chose this route on 18 Nov 2026. Deleted before the PR is reviewed.
name: oneoff-generate-api-client

on:
  push:
    branches: [claude/project-thread-sgyqy5]
    paths:
      - api/**
      - .github/workflows/oneoff-generate-api-client.yml

permissions:
  contents: read

env:
  FLUTTER_SUPPRESS_ANALYTICS: "true"
  DART_SUPPRESS_ANALYTICS: "true"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: app/pubspec.yaml
      - name: Turn off tool analytics
        run: flutter config --no-analytics && dart --disable-analytics
      - name: Generate
        run: api/generate-dart-client.sh
      - name: List and analyze the generated package
        working-directory: app/packages
        run: |
          find . -type f | sort
          cd wio_api && dart pub get && dart analyze || true
      - name: Print the package as base64 tarball
        working-directory: app/packages
        run: |
          tar --sort=name --owner=0 --group=0 --mtime='2026-11-18 00:00Z' -czf /tmp/wio_api.tgz wio_api --exclude=.dart_tool --exclude=pubspec.lock
          sha256sum /tmp/wio_api.tgz
          echo "BEGIN-WIO-API-TGZ"
          base64 -w 0 /tmp/wio_api.tgz
          echo
          echo "END-WIO-API-TGZ"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wio-api-client
          path: /tmp/wio_api.tgz

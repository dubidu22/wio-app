# ONE-OFF (plan 004, D-91): generates the Dart API client on GitHub's runner,
# because the cloud session that wrote the #4 PR may not run the generator,
# and commits it to the branch (job logs and artifacts cannot be downloaded
# from that session).
# Colin chose this route on 18 Nov 2026. Deleted before the PR is reviewed.
name: oneoff-generate-api-client

on:
  push:
    branches: [claude/project-thread-sgyqy5]
    paths:
      - api/**
      - .github/workflows/oneoff-generate-api-client.yml

permissions:
  contents: write

env:
  FLUTTER_SUPPRESS_ANALYTICS: "true"
  DART_SUPPRESS_ANALYTICS: "true"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: app/pubspec.yaml
      - name: Turn off tool analytics
        run: flutter config --no-analytics && dart --disable-analytics
      - name: Generate
        run: api/generate-dart-client.sh
      - name: List and analyze the generated package
        working-directory: app/packages
        run: |
          find . -type f | sort
          cd wio_api && dart pub get && dart analyze || true
      - name: Commit the generated package to this branch
        run: |
          rm -rf app/packages/wio_api/.dart_tool app/packages/wio_api/pubspec.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/packages/wio_api
          git commit -m "app: generated Dart API client from api/openapi.yaml (#4)" -m "Generated by tonik 0.11.1 in the one-off workflow (D-91)."
          git push origin HEAD:claude/project-thread-sgyqy5

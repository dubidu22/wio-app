# Builds the throwaway speech spike (spikes/speech, issue #9, D-45) as a
# sideloadable Android APK for Colin's hand test. Not a release workflow:
# the APK is signed with the debug key and only uploaded as a run artifact.
# Not a required check, so a path filter is fine here (unlike ci.yml, D-33).
name: spike-speech-apk

on:
  pull_request:
    paths:
      - "spikes/speech/**"
      - ".github/workflows/spike-speech-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spike-speech-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: spikes/speech
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      # D-41: the Flutter version comes from the spike's pubspec only.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: spikes/speech/pubspec.yaml
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      # D-35: fail when no test ran.
      - name: Tests
        run: |
          flutter test --reporter expanded | tee "$RUNNER_TEMP/test.log"
          grep -Eq '\+[1-9][0-9]*: All tests passed' "$RUNNER_TEMP/test.log"

      - name: Build APK (release mode, debug-signed)
        run: flutter build apk --release

      # D-46: the installed build may not reach the network.
      - name: Check permissions
        run: |
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          "$aapt2" dump permissions build/app/outputs/flutter-apk/app-release.apk | tee "$RUNNER_TEMP/perms.txt"
          grep -q 'android.permission.RECORD_AUDIO' "$RUNNER_TEMP/perms.txt"
          if grep -q 'android.permission.INTERNET' "$RUNNER_TEMP/perms.txt"; then
            echo "::error::The spike APK must not have the INTERNET permission (D-46)"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: speech-spike-apk
          path: spikes/speech/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error

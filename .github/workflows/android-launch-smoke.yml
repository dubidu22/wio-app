# Starts the release APK on an emulator and fails when the app dies at launch
# (issue #91, plan 091, D-393..D-396). Same release build as android-handtest
# (R8, plugins, engine), but debug-signed: no environment, no secrets. The full
# logcat is always uploaded; it is the diagnosis of a crash at start.
name: android-launch-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-launch-smoke
  cancel-in-progress: true

env:
  WIO_API_URL: https://api-staging.wieder-in-ordnung.de
  FLUTTER_SUPPRESS_ANALYTICS: "true"
  DART_SUPPRESS_ANALYTICS: "true"
  PACKAGE: de.wiederinordnung.app.handtest

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: app/pubspec.yaml
          cache: true

      - name: Turn off tool analytics
        run: flutter config --no-analytics && dart --disable-analytics

      - name: Build the release APK (as android-handtest, debug key)
        working-directory: app
        env:
          WIO_HANDTEST: "true"
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --release \
            --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define=WIO_API_URL="$WIO_API_URL"

      - name: Launch on an emulator (tools/ci/android-launch-check.sh)
        run: >-
          tools/ci/android-launch-check.sh
          app/build/app/outputs/flutter-apk/app-release.apk
          "$PACKAGE"
          "$RUNNER_TEMP/logcat.txt"

      - name: Upload the logcat
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: launch-smoke-logcat
          path: ${{ runner.temp }}/logcat.txt
          retention-days: 3
          if-no-files-found: ignore

# Starts the release APK on an emulator and fails when the app dies at launch
# (issue #91, plan 091, D-393..D-396). Same release build as android-handtest
# (R8, plugins, engine), but debug-signed: no environment, no secrets. The full
# logcat is always uploaded; it is the diagnosis of a crash at start.
name: android-launch-smoke

on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-nnmhhh] # TEMPORARY (plan 091 P5), removed before review

permissions:
  contents: read

concurrency:
  group: android-launch-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  WIO_API_URL: https://api-staging.wieder-in-ordnung.de
  FLUTTER_SUPPRESS_ANALYTICS: "true"
  DART_SUPPRESS_ANALYTICS: "true"
  PACKAGE: de.wiederinordnung.app.handtest

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: app/pubspec.yaml
          cache: true

      - name: Turn off tool analytics
        run: flutter config --no-analytics && dart --disable-analytics

      - name: Build the release APK (as android-handtest, debug key)
        working-directory: app
        env:
          WIO_HANDTEST: "true"
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --release \
            --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define=WIO_API_URL="$WIO_API_URL"

      # The runner has KVM; the group rule lets the emulator use it.
      - name: Allow KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot an Android 14 emulator
        run: |
          set -euo pipefail
          sdk="$ANDROID_HOME"
          sdkm="$sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkm" --licenses > /dev/null || true
          "$sdkm" "emulator" "platform-tools" "system-images;android-34;google_apis;x86_64" > /dev/null
          echo no | "$sdk/cmdline-tools/latest/bin/avdmanager" create avd -n wio -k "system-images;android-34;google_apis;x86_64" -d pixel_6 --force
          adb="$sdk/platform-tools/adb"
          "$adb" start-server
          setsid nohup "$sdk/emulator/emulator" -avd wio -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect < /dev/null > "$RUNNER_TEMP/emulator.log" 2>&1 &
          booted=0
          for _ in $(seq 1 100); do
            if [[ "$(timeout 10 "$adb" shell getprop sys.boot_completed 2> /dev/null | tr -d '\r')" == 1 ]]; then booted=1; break; fi
            sleep 5
          done
          if [[ "$booted" != 1 ]]; then
            echo "::error::emulator did not boot in time"
            "$adb" devices || true
            tail -n 60 "$RUNNER_TEMP/emulator.log" || true
            exit 1
          fi
          "$adb" shell input keyevent 82 || true

      - name: Install, launch, wait 20 s
        id: launch
        run: |
          set -uo pipefail
          adb="$ANDROID_HOME/platform-tools/adb"
          "$adb" install -r app/build/app/outputs/flutter-apk/app-release.apk
          "$adb" logcat -c
          "$adb" shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1
          sleep 20
          "$adb" logcat -d > "$RUNNER_TEMP/logcat.txt"
          pid="$("$adb" shell pidof "$PACKAGE" | tr -d '\r' || true)"
          echo "pid=${pid:-none}"
          failed=0
          if [[ -z "$pid" ]]; then
            echo "::error::the app is not running 20 s after launch"
            failed=1
          fi
          if grep -E 'FATAL EXCEPTION|Fatal signal|Process: '"$PACKAGE"'.*PID|has died' "$RUNNER_TEMP/logcat.txt" > "$RUNNER_TEMP/crash.txt"; then
            echo "::error::crash markers in logcat, see the log artifact"
            failed=1
          fi
          echo "---- crash lines ----"
          grep -n -B2 -A40 -m1 'FATAL EXCEPTION' "$RUNNER_TEMP/logcat.txt" | head -n 120 || true
          grep -n -B5 -A30 -m1 'Fatal signal' "$RUNNER_TEMP/logcat.txt" | head -n 80 || true
          exit "$failed"

      - name: Upload the logcat
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: launch-smoke-logcat
          path: ${{ runner.temp }}/logcat.txt
          retention-days: 3
          if-no-files-found: ignore

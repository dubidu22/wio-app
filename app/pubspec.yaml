name: wio_app
description: "wio-app: field app for tidy-up and moving work."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0
  # The only place the Flutter version is pinned (D-41); CI reads it from here.
  flutter: 3.50.0

dependencies:
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  intl: any
  material_ui: ^1.11.1
  path_provider: ^2.1.6
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  # Generated API client, the app's only way to the server (INV-02, D-91).
  wio_api:
    path: packages/wio_api

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1
  crypto: ^3.0.8
  http: ^1.6.0
  tonik_util: ^0.11.1
  sqlite3: ^3.9.1

flutter:
  uses-material-design: true
  generate: true
  # Bundled so that no platform fetches fonts from a CDN at run time (D-40).
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500

; PHP settings for the hosting (PHP-FPM/CGI reads .user.ini; plan 010).
; Errors go to the log, never into a response. Request bodies are capped at
; 5 MiB: a file chunk is at most 4 MiB (D-186) plus headroom. .htaccess sets
; the same cap for Apache, which also covers PUT.
display_errors = Off
display_startup_errors = Off
log_errors = On
post_max_size = 5M
upload_max_filesize = 5M

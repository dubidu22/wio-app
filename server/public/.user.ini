; PHP settings for the hosting (PHP-FPM/CGI reads .user.ini; plan 010).
; Errors go to the log, never into a response. Bodies up to 8 MB reach PHP,
; enough for a 4 MiB file chunk with headers (#6 may change the limits).
display_errors = Off
display_startup_errors = Off
log_errors = On
post_max_size = 8M
upload_max_filesize = 8M
